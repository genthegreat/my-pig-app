# My Pigs — offline-first PWA for a piggery.
#
#   docker compose up -d --build            # http://<host>:3000
#   docker compose --profile https up -d --build   # HTTPS: set DOMAIN in .env first
#
# Settings (invite code, mail, public address) come from .env — see .env.example.
#
# The container serves the app and keeps the accounts that may sign in to it
# (the auth_data volume — back that up if you care about the accounts).
# All farm data lives in the phone's browser storage, so there is no farm
# database to back up here — use Settings → Export backup on the phone.

services:
  app:
    build: .
    image: my-pigs-app:latest
    container_name: my-pigs
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    # Every setting comes from .env in this folder (see .env.example).
    env_file:
      - path: .env
        required: false
    # Fixed inside the container, whatever .env says: PORT there is the
    # port published on the host, not the one the server listens on.
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
      AUTH_DATA_FILE: /data/auth.json
    volumes:
      - auth_data:/data

  # Automatic HTTPS for phone installation. With DOMAIN set to a DNS name
  # that points at this machine (ports 80/443 open) Caddy gets a real
  # certificate; left at the default "localhost" it issues a self-signed one.
  caddy:
    image: caddy:2-alpine
    container_name: my-pigs-https
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  auth_data:
  caddy_data:
  caddy_config:
