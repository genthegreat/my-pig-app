# My Pigs — static export behind nginx. Mirrors scripts/serve.mjs.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;  # keep the published port / proxy host in redirects

    # nginx's default mime.types predates web manifests
    types {
        application/manifest+json webmanifest;
        text/html html;
        text/css css;
        text/javascript js;
        application/json json;
        image/png png;
        image/svg+xml svg;
        text/plain txt;
        font/woff2 woff2;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/json text/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # The worker must always be re-checked, or an old version sticks forever.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # Content-hashed build assets can be cached forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "same-origin";
    }

    error_page 404 /404.html;
}
